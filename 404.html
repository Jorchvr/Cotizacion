<!doctype html>
<html lang="es" data-theme="light" data-layout="comodo" data-persona="admin">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pro Padel — Página no encontrada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{surface:'rgb(var(--surface) / <alpha-value>)',elevated:'rgb(var(--elevated) / <alpha-value>)',accent:'rgb(var(--accent) / <alpha-value>)',muted:'rgb(var(--muted) / <alpha-value>)',ink:'rgb(var(--ink) / <alpha-value>)',ink2:'rgb(var(--ink2) / <alpha-value>)'},fontFamily:{heading:['Manrope','system-ui','sans-serif'],body:['Inter','system-ui','sans-serif']},borderRadius:{proto:'var(--radius)'}}}};</script>
  <link rel="stylesheet" href="css/styles.css" /><link rel="stylesheet" href="css/feedback.css" />
  <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-surface text-ink antialiased">
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="max-w-md text-center">
    <div class="brand-mark mx-auto mb-6" style="width: 56px; height: 56px; font-size: 1.4rem">PP</div>
    <div class="text-6xl font-heading font-bold text-accent mb-2">404</div>
    <h1 class="text-2xl font-heading font-bold mb-2">Página no encontrada</h1>
    <p class="text-ink2 mb-6">Es posible que hayas escrito mal la dirección o que la pantalla ya no exista. Regresa al tablero y sigue navegando desde ahí.</p>
    <div class="proto-actions justify-center">
      <a href="dashboard.html" class="btn btn-primary">← Volver al tablero</a>
      <a href="index.html" class="btn btn-secondary">Iniciar sesión</a>
    </div>
  </div>
</div>

<div id="proto-controls">
  <div class="proto-bar">
    <div class="proto-bar-section"><span class="proto-bar-label">Tema</span><div class="proto-seg-group">
      <button class="proto-seg" data-theme-option="light" aria-pressed="true">Claro</button>
      <button class="proto-seg" data-theme-option="dark" aria-pressed="false">Oscuro</button></div></div>
    <div class="proto-bar-section"><span class="proto-bar-label">Densidad</span><div class="proto-seg-group">
      <button class="proto-seg" data-layout-option="comodo" aria-pressed="true">Cómodo</button>
      <button class="proto-seg" data-layout-option="compacto" aria-pressed="false">Compacto</button></div></div>
    <div class="proto-bar-section"><span class="proto-bar-label">Rol</span><div class="proto-seg-group">
      <button class="proto-seg" data-persona-option="admin" aria-pressed="true">Admin</button>
      <button class="proto-seg" data-persona-option="gerente" aria-pressed="false">Gerente</button>
      <button class="proto-seg" data-persona-option="recepcion" aria-pressed="false">Recepción</button></div></div>
    <div class="proto-bar-section">
      <button class="proto-seg" data-share>🔗 Compartir</button>
      <button class="proto-seg" data-feedback-toggle>💬 Comentar</button>
    </div>
  </div>
</div>

<script src="js/state.js"></script><script src="js/theme.js"></script><script src="js/layout.js"></script>
<script src="js/data.js"></script><script src="js/persona.js"></script><script src="js/ui.js"></script>
<script src="js/app.js"></script><script src="js/feedback.js"></script>
</body>
</html>
